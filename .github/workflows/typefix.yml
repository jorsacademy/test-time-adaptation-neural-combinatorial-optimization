name: One-time strict typing cleanup

on:
  push:
    branches: [budgeted-instance-adaptation]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: budgeted-instance-adaptation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -e ".[dev]"

      - name: Apply and verify strict typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = -1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"expected text not found in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, count), encoding="utf-8")

          replace(
              "src/ttanco/domain.py",
              "        distances = np.linalg.norm(difference, axis=2)\n",
              "        distances: np.ndarray = np.linalg.norm(difference, axis=2)\n",
          )
          replace(
              "src/ttanco/dataset.py",
              "    return (coordinates - minimum) / span\n",
              "    scaled: np.ndarray = (coordinates - minimum) / span\n    return scaled\n",
          )
          replace(
              "src/ttanco/training.py",
              "            loss.backward()\n",
              "            loss.backward()  # type: ignore[no-untyped-call]\n",
              count=1,
          )
          replace(
              "src/ttanco/adaptation.py",
              "            loss.backward()\n",
              "            loss.backward()  # type: ignore[no-untyped-call]\n",
              count=1,
          )
          replace(
              "src/ttanco/adaptation.py",
              "        loss.backward()\n",
              "        loss.backward()  # type: ignore[no-untyped-call]\n",
              count=1,
          )
          replace(
              "src/ttanco/cli.py",
              "        model, report = train_policy(\n",
              "        model, training_report = train_policy(\n",
          )
          replace(
              "src/ttanco/cli.py",
              '            metadata={"training_report": report.to_dict()},\n',
              '            metadata={"training_report": training_report.to_dict()},\n',
          )
          replace(
              "src/ttanco/cli.py",
              "        payload = report.to_dict()\n",
              "        payload = training_report.to_dict()\n",
              count=1,
          )
          replace(
              "src/ttanco/cli.py",
              "        report = evaluate_methods(\n",
              "        evaluation_report = evaluate_methods(\n",
          )
          replace(
              "src/ttanco/cli.py",
              "        save_report_json(report, args.output_json)\n",
              "        save_report_json(evaluation_report, args.output_json)\n",
          )
          replace(
              "src/ttanco/cli.py",
              "            save_report_csv(report, args.output_csv)\n",
              "            save_report_csv(evaluation_report, args.output_csv)\n",
          )
          replace(
              "src/ttanco/cli.py",
              '        return {**report.to_dict(), "checkpoint_metadata": metadata}\n',
              '        return {**evaluation_report.to_dict(), "checkpoint_metadata": metadata}\n',
          )
          replace(
              "src/ttanco/cli.py",
              "        report = run_research(config, checkpoint_directory=args.checkpoint_directory)\n",
              "        research_report = run_research(\n            config, checkpoint_directory=args.checkpoint_directory\n        )\n",
          )
          replace(
              "src/ttanco/cli.py",
              "        save_research_report(report, args.output_report)\n        return report.to_dict()\n",
              "        save_research_report(research_report, args.output_report)\n        return research_report.to_dict()\n",
          )
          PY
          ruff format .
          ruff check .
          ruff format --check .
          mypy --python-version 3.11 src
          pytest
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix strict typing boundaries'
          git push origin HEAD:budgeted-instance-adaptation
